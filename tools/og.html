<!doctype html>
<!-- Source for og.jpg and apple-touch-icon.png. Render with tools/render-images.js. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/site.css">
<style>
  body { margin: 0; padding: 40px; background-color: #ccc; }
  #og { width: 1200px; height: 630px; position: relative; overflow: hidden;
        background-color: var(--paper);
        background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 48px 48px, 48px 48px, 8px 8px, 8px 8px; }
  #og .ruler { position: absolute; left: 0; right: 0; top: 0; height: 34px; }
  #og .in { position: absolute; left: 72px; right: 72px; top: 96px; }
  #og .label { font-size: 18px; }
  #og h1 { margin: 26px 0 0; font-size: 150px; text-transform: none; letter-spacing: -.025em; line-height: 1; }
  #og .dl { margin-top: 22px; display: flex; align-items: center; gap: 12px; color: var(--mark); }
  #og .dl i { width: 2px; height: 22px; background: currentColor; } #og .dl b { flex: 1; height: 2px; background: currentColor; }
  #og .dl span { font: 500 18px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mark-ink); }
  #og .foot { position: absolute; left: 72px; right: 72px; bottom: 54px; display: flex; justify-content: space-between; align-items: end; }
  #og .foot p { margin: 0; font: italic 400 30px/1.3 var(--text); color: var(--ink-2); }
  #og .brand { font-size: 24px; } #og .brand svg { width: 34px; height: 34px; }
  #icon { width: 180px; height: 180px; margin-top: 40px; background: var(--paper); display: grid; place-items: center; }
</style></head><body>
<div id="og">
  <div class="ruler"></div>
  <div class="in">
    <p class="label">Sheet A-1 &nbsp;/&nbsp; Scale 1:1</p>
    <h1 class="display">Things<br>I build.</h1>
    <div class="dl"><i></i><b></b><span>3 apps · 1 board game · more coming</span><b></b><i></i></div>
  </div>
  <div class="foot">
    <p>Various interests and builds. A constantly moving target!</p>
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4.5 2.5v17h17" stroke-width="3" stroke-linecap="square"/><path d="M9 19.5v-2.5M13 19.5v-3.5M17 19.5v-2.5M4.5 15h2.5M4.5 11h3.5M4.5 7h2.5" stroke-width="1.4"/></svg>Cascino Builders</span>
  </div>
</div>
<div id="icon"><img src="/favicon.svg" width="150" height="150" alt=""></div>
</body></html>
